vision_controller_node:
  ros__parameters:
    image_topic: /camera/image_raw/image_color
    camera_info_topic: /camera/image_raw/camera_info
    odom_topic: /odom
    scan_topic: /scan
    cmd_vel_topic: /cmd_vel
    annotated_image_topic: /debug/annotated_image
    state_topic: /autonomy/state
    perf_topic: /autonomy/perf

    # Safety default: framework starts in monitoring mode. Set dry_run:=false to move.
    dry_run: true
    control_rate_hz: 20.0

    cruise_linear_x: 0.12
    track_linear_x: 0.08
    track_kp: 0.002
    max_angular_z: 0.65

    turn_kp: 1.4
    turn_angle_rad: 1.57079632679
    back_turn_angle_rad: 3.14159265359
    turn_tolerance_rad: 0.05
    min_turn_angular_z: 0.18
    search_linear_x: 0.06
    cooldown_linear_x: 0.08

    logo_stop_s: 3.0
    horizon_ratio: 0.5

    center_tolerance_px: 40.0
    target_bbox_area_ratio: 0.08
    read_timeout_s: 3.0
    cooldown_s: 1.5

    arrow_smooth_arc_controller:
      # acquire paper, not stable label
      min_confidence: 0.45
      acquire_area_threshold: 0.020

      # pass later, avoid cutting control too early
      close_area_threshold: 0.24
      close_bottom_ratio: 0.995

      focal_px: 600.0

      # heading correction: make it softer
      heading_sign: 1.0
      heading_scale: 0.60
      heading_oversteer_deg: 5.0
      latched_yaw_alpha: 0.20
      latched_heading_confidence_min: 0.55
      latched_arrow_presence_confidence_min: 0.45
      kp_heading: 0.45

      # center correction: keep it active but not too aggressive
      center_sign: -1.0
      kp_center: 0.70
      center_capture_threshold_px: 90.0
      min_center_bias_gain: 0.10
      max_center_bias_gain: 0.60
      max_center_bias_deg: 10.0

      # angular smoothing
      max_angular_z: 0.18
      max_angular_accel: 0.35
      angular_lowpass_alpha: 0.18
      yaw_error_deadband_deg: 3.0

      # confidence-weighted heading
      heading_confidence_soft_min: 0.40
      heading_confidence_full: 0.80
      arrow_presence_confidence_soft_min: 0.35
      arrow_presence_confidence_full: 0.80

      # kept for compatibility, but new controller should not rely on these
      yaw_latch_alpha: 0.15
      heading_sample_window: 8
      heading_sample_min_count: 3
      heading_sample_tolerance_deg: 30.0
      min_heading_confidence: 0.65
      min_arrow_presence_confidence: 0.45
      heading_update_max_area_ratio: 0.09
      heading_update_max_bottom_ratio: 0.95

      # speed
      track_speed: 0.030
      slow_track_speed: 0.022
      slow_yaw_error_deg: 25.0
      slow_center_error_px: 100.0

      wait_linear_speed: 0.025
      pass_speed: 0.035
      pass_time_sec: 0.10
      missing_detection_hold_sec: 0.20
      pass_max_heading_error_deg: 6.0
      finish_heading_timeout_sec: 1.5
      finish_heading_speed: 0.015
      finish_heading_kp: 0.40
      finish_heading_max_angular_z: 0.08
      finish_center_kp: 0.35
      finish_center_max_bias_deg: 5.0
      finish_center_tolerance_px: 45.0
      min_track_time_sec: 0.8

      debug_log: true

    arrow_threshold_method: otsu
    arrow_hsv_v_max: 80
    arrow_blur_kernel: 5
    arrow_morph_open_kernel: 3
    arrow_morph_close_kernel: 5
    arrow_dilate_kernel: 7
    arrow_dilate_iterations: 1
    arrow_min_area_ratio: 0.005
    arrow_max_area_ratio: 0.40
    arrow_min_aspect_ratio: 0.5
    arrow_max_aspect_ratio: 2.0
    arrow_min_black_pixel_ratio: 0.03
    arrow_warp_width: 300
    arrow_warp_height: 300
    arrow_inner_crop_margin_ratio: 0.12
    arrow_history_size: 5
    arrow_min_stable_count: 4
    arrow_process_width: 960
    arrow_bbox_padding_ratio: 0.20
    arrow_min_arrow_area_ratio: 0.01
    arrow_paper_v_min: 130
    arrow_paper_s_max: 90
    arrow_paper_min_area_ratio: 0.001
    arrow_paper_max_area_ratio: 0.25
    arrow_paper_min_aspect_ratio: 0.3
    arrow_paper_max_aspect_ratio: 12.0
    arrow_floor_roi_min_y_ratio: 0.45
    arrow_candidate_max_center_error_ratio: 0.40
    arrow_min_candidate_bottom_ratio: 0.45
    arrow_reject_back_direction: true
    arrow_max_valid_bbox_width_ratio: 0.70
    arrow_max_valid_bbox_height_ratio: 0.70
    arrow_max_valid_final_area_ratio: 0.16
    arrow_min_valid_final_area_ratio: 0.001
    arrow_max_border_touch_ratio: 0.03
    arrow_max_valid_paper_aspect_ratio: 4.0
    arrow_min_valid_paper_aspect_ratio: 0.25
    arrow_min_history_confidence: 0.45
    arrow_use_axis_direction: false
    arrow_use_paper_orientation_heading: false
    arrow_paper_heading_forward_angle_rad: 1.57079632679
    arrow_paper_heading_use_previous_when_ambiguous: true
    arrow_paper_heading_ambiguity_margin_rad: 0.20
    arrow_min_arrow_presence_confidence: 0.30
    arrow_min_arrow_component_density: 0.25
    arrow_min_arrow_component_solidity: 0.42
    arrow_min_arrow_component_compactness: 0.055
    arrow_max_arrow_component_area_ratio: 0.12
