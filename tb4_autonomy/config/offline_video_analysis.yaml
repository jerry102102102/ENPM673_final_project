vision_controller_node:
  ros__parameters:
    # Offline-only tuning for low-resolution real OAK-D preview recordings.
    # This file is intentionally separate from autonomy.yaml so lab driving
    # behavior is not changed by video-analysis experiments.

    arrow_smooth_arc_controller:
      min_confidence: 0.30
      acquire_area_threshold: 0.006
      close_area_threshold: 0.24
      close_bottom_ratio: 0.995
      focal_px: 250.0
      heading_sign: 1.0
      heading_scale: 0.15
      heading_oversteer_deg: 2.0
      latched_yaw_alpha: 0.20
      previous_heading_pull_gain: 0.60
      previous_heading_pull_decay_sec: 3.50
      previous_heading_pull_start_delta_deg: 8.0
      previous_heading_pull_max_angular_z: 0.070
      latched_heading_confidence_min: 0.35
      latched_arrow_presence_confidence_min: 0.25
      kp_heading: 0.30
      center_sign: -1.0
      kp_center: 0.45
      center_capture_threshold_px: 35.0
      min_center_bias_gain: 0.10
      max_center_bias_gain: 0.45
      max_center_bias_deg: 6.0
      max_angular_z: 0.10
      max_angular_accel: 0.15
      angular_lowpass_alpha: 0.12
      yaw_error_deadband_deg: 3.0
      heading_confidence_soft_min: 0.25
      heading_confidence_full: 0.70
      arrow_presence_confidence_soft_min: 0.20
      arrow_presence_confidence_full: 0.70
      yaw_latch_alpha: 0.15
      heading_sample_window: 4
      heading_sample_min_count: 2
      heading_sample_tolerance_deg: 35.0
      min_heading_confidence: 0.35
      min_arrow_presence_confidence: 0.25
      heading_update_max_area_ratio: 0.16
      heading_update_max_bottom_ratio: 0.98
      track_speed: 0.028
      slow_track_speed: 0.020
      slow_yaw_error_deg: 25.0
      slow_center_error_px: 40.0
      wait_linear_speed: 0.025
      pass_speed: 0.035
      pass_time_sec: 0.10
      missing_detection_hold_sec: 0.20
      execute_latched_on_lost: true
      pass_max_heading_error_deg: 6.0
      finish_heading_timeout_sec: 1.5
      finish_heading_speed: 0.015
      finish_heading_kp: 0.40
      finish_heading_max_angular_z: 0.08
      finish_center_kp: 0.35
      finish_center_max_bias_deg: 5.0
      finish_center_tolerance_px: 22.0
      min_track_time_sec: 0.4
      close_camera_bottom_distance_in: 18.5
      close_arrow_bottom_distance_in: 22.375
      post_close_min_travel_m: 0.0
      post_close_speed: 0.055
      post_close_timeout_sec: 3.0
      active_target_area_drop_ratio: 0.70
      active_target_bottom_drop_ratio: 0.08

    arrow_threshold_method: hsv
    arrow_hsv_v_max: 140
    arrow_blur_kernel: 3
    arrow_morph_open_kernel: 1
    arrow_morph_close_kernel: 3
    arrow_dilate_kernel: 3
    arrow_dilate_iterations: 1

    # Pixel gates are for 250x250 offline recordings where ratio-only gates
    # are too hard to reason about.
    arrow_min_area_ratio: 0.0005
    arrow_max_area_ratio: 0.45
    arrow_min_area_px: 8.0
    arrow_max_area_px: 18000.0
    arrow_min_aspect_ratio: 0.20
    arrow_max_aspect_ratio: 8.0
    arrow_min_black_pixel_ratio: 0.015

    arrow_warp_width: 260
    arrow_warp_height: 260
    arrow_inner_crop_margin_ratio: 0.08
    arrow_history_size: 3
    arrow_min_stable_count: 2
    arrow_process_width: 250
    arrow_bbox_padding_ratio: 0.12
    arrow_fallback_bbox_padding_ratio: 1.4
    arrow_merge_black_fragments_fallback: true
    arrow_black_fragment_group_radius_px: 55.0
    arrow_min_arrow_area_ratio: 0.003

    arrow_paper_v_min: 150
    arrow_paper_s_max: 95
    arrow_paper_min_area_ratio: 0.0006
    arrow_paper_max_area_ratio: 0.35
    arrow_paper_min_area_px: 120.0
    arrow_paper_max_area_px: 18000.0
    arrow_paper_min_aspect_ratio: 0.20
    arrow_paper_max_aspect_ratio: 14.0

    arrow_floor_roi_min_y_ratio: 0.50
    arrow_candidate_max_center_error_ratio: 0.65
    arrow_min_candidate_bottom_ratio: 0.62
    arrow_max_candidate_height_ratio: 0.68
    arrow_max_candidate_width_ratio: 0.90
    arrow_max_candidate_area_ratio: 0.30
    arrow_min_candidate_area_px: 8.0
    arrow_max_candidate_area_px: 18000.0

    arrow_reject_back_direction: true
    arrow_max_valid_bbox_width_ratio: 0.90
    arrow_max_valid_bbox_height_ratio: 0.70
    arrow_max_valid_final_area_ratio: 0.30
    arrow_min_valid_final_area_ratio: 0.0006
    arrow_max_border_touch_ratio: 0.03
    arrow_max_valid_paper_aspect_ratio: 8.0
    arrow_min_valid_paper_aspect_ratio: 0.20
    arrow_min_history_confidence: 0.25
    arrow_use_axis_direction: false
    arrow_use_paper_orientation_heading: false
    arrow_paper_heading_forward_angle_rad: 1.57079632679
    arrow_paper_heading_use_previous_when_ambiguous: true
    arrow_paper_heading_ambiguity_margin_rad: 0.25

    arrow_min_arrow_presence_confidence: 0.18
    arrow_min_arrow_component_density: 0.16
    arrow_min_arrow_component_solidity: 0.25
    arrow_min_arrow_component_compactness: 0.025
    arrow_max_arrow_component_area_ratio: 0.35
